---
- name: Delivery
  hosts: localhost
  tags: delivery 
  tasks:
    - name: Login to Docker Hub
      community.docker.docker_login:
        username: taifalsubaie
        password: T12341234f@

    - name: Build Docker Image
      community.docker.docker_image:
        name: taifalsubaie/react-test
        source: build
        build:
          path: .

    - name: Push Docker Image
      community.docker.docker_image:
        name: taifalsubaie/react-test
        push: true
        source: local

- name: Deploy to docker
  hosts: docker_servers
  become: true
  tags: deploy 
  tasks:
    - name: Pull an image
      community.docker.docker_image:
        name: taifalsubaie/react-test
        source: pull

    - name: Remove old container
      community.docker.docker_container:
        name: react-test
        state: absent

    - name: Run container
      community.docker.docker_container:
        name: react-test
        image: taifalsubaie/react-test
        state: started
        recreate: true
        published_ports:
          - "8085:80"

